<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded App Tile -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Glass glow overlay -->
  <circle cx="120" cy="120" r="160" fill="#ffffff" opacity="0.12" filter="blur(30px)" />
  <!-- Open Book Silhouette -->
  <g filter="url(#shadow)" transform="translate(80, 110) scale(0.68)">
    <path d="M256 160c-48-32-112-32-160 0v240c48-32 112-32 160 0 48-32 112-32 160 0V160c-48-32-112-32-160 0z" 
          fill="#ffffff" opacity="0.95" />
    <path d="M256 160v240" stroke="#4f46e5" stroke-width="14" stroke-linecap="round" />
    <!-- Barcode lines accent inside book -->
    <rect x="130" y="240" width="8" height="60" fill="#4f46e5" opacity="0.8" rx="4" />
    <rect x="146" y="240" width="16" height="60" fill="#4f46e5" opacity="0.8" rx="4" />
    <rect x="170" y="240" width="6" height="60" fill="#4f46e5" opacity="0.8" rx="3" />
    <rect x="184" y="240" width="12" height="60" fill="#4f46e5" opacity="0.8" rx="4" />
    <rect x="204" y="240" width="18" height="60" fill="#4f46e5" opacity="0.8" rx="4" />

    <!-- Quill / Bookmark Accent -->
    <path d="M330 190 L390 190 L360 270 L330 190 Z" fill="url(#gold)" opacity="0.95" />
  </g>
</svg>
