# ==============================================================================
# Nginx Configuration for EduOps Platform
# Domain: ardingly.service.kz
# Server IP: 10.1.13.50 -> Node backend on 127.0.0.1:5001
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ardingly.service.kz;

    # Support high-resolution camera photo uploads for ticket attachments
    client_max_body_size 50M;

    # Enable compression for fast asset loading
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    location / {
        # Proxy all traffic to the Node.js production server on port 5001
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # WebSocket support (for live updates & SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Upload timeouts for mobile camera uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
